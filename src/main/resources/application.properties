# ============================================================
# TCC - API REST Best Practices
# application.properties
# ============================================================

# ---- Servidor ----
server.port=8080
server.servlet.context-path=/

# ---- Banco de Dados H2 (in-memory) ----
spring.datasource.url=jdbc:h2:mem:tccdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT ----
# Chave secreta (min. 256 bits / 32 chars) - trocar em produção
app.jwt.secret=3f8a2b1c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a
app.jwt.expiration-ms=86400000

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ---- Logging ----
logging.level.org.example=DEBUG
logging.level.org.springframework.security=WARN

