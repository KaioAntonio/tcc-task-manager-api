<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#526075}.line{stroke:#64748b;stroke-width:5}.v1{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.v2{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.dot{fill:#fff;stroke:#64748b;stroke-width:5}.label{font-size:20px;font-weight:bold}</style>
  <rect width="1200" height="510" fill="#fff"/><text x="60" y="60" class="title">Coexistencia e migracao entre v1 e v2</text>
  <line x1="120" y1="250" x2="1080" y2="250" class="line"/>
  <circle cx="200" cy="250" r="16" class="dot"/><circle cx="570" cy="250" r="16" class="dot"/><circle cx="940" cy="250" r="16" class="dot"/>
  <rect x="85" y="110" width="230" height="95" rx="12" class="v1"/><text x="132" y="150" class="label">v1 publicada</text><text x="110" y="180" class="sub">/api/v1 permanece estavel</text>
  <rect x="430" y="300" width="280" height="105" rx="12" class="v2"/><text x="485" y="340" class="label">v2 adicionada</text><text x="452" y="370" class="sub">/api/v2 com contrato evoluido</text>
  <rect x="810" y="110" width="260" height="95" rx="12" class="v1"/><text x="845" y="150" class="label">Migracao gradual</text><text x="835" y="180" class="sub">clientes escolhem quando migrar</text>
  <text x="130" y="285" class="sub">Contrato original</text><text x="485" y="285" class="sub">Soft delete: 200 + body</text><text x="880" y="285" class="sub">Sem breaking change em v1</text>
  <text x="60" y="465" class="sub">Figura 3 - Linha do tempo de coexistencia e migracao entre as versoes v1 e v2.</text>
</svg>
