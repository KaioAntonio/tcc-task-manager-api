  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#334155}.layer{stroke-width:2}.name{font-size:22px;font-weight:bold}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
