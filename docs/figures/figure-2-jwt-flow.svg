<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#526075}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.label{font-size:18px;font-weight:bold}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="600" fill="#fff"/><text x="60" y="60" class="title">Fluxo de autenticacao JWT e validacao de acesso a tarefa</text>
  <rect x="55" y="180" width="175" height="100" rx="12" class="box"/><text x="88" y="225" class="label">Cliente</text><text x="75" y="255" class="sub">credenciais / token</text>
  <rect x="320" y="180" width="210" height="100" rx="12" class="box"/><text x="350" y="220" class="label">AuthService</text><text x="343" y="250" class="sub">login ou registro</text>
  <rect x="620" y="180" width="210" height="100" rx="12" class="box"/><text x="647" y="220" class="label">JwtService</text><text x="652" y="250" class="sub">gera token assinado</text>
  <rect x="920" y="180" width="210" height="100" rx="12" class="box"/><text x="950" y="220" class="label">Cliente</text><text x="948" y="250" class="sub">Bearer &lt;JWT&gt;</text>
  <line x1="230" y1="230" x2="320" y2="230" class="arrow"/><line x1="530" y1="230" x2="620" y2="230" class="arrow"/><line x1="830" y1="230" x2="920" y2="230" class="arrow"/>
  <rect x="300" y="385" width="270" height="105" rx="12" class="box"/><text x="330" y="427" class="label">JwtAuthFilter</text><text x="320" y="458" class="sub">valida assinatura e expiracao</text>
  <rect x="670" y="385" width="250" height="105" rx="12" class="box"/><text x="700" y="427" class="label">TaskService</text><text x="693" y="458" class="sub">valida ownership / role</text>
  <rect x="995" y="385" width="145" height="105" rx="12" class="warn"/><text x="1027" y="427" class="label">Resposta</text><text x="1013" y="458" class="sub">200 / 401 / 403</text>
  <line x1="920" y1="280" x2="570" y2="385" class="arrow"/><line x1="570" y1="438" x2="670" y2="438" class="arrow"/><line x1="920" y1="438" x2="995" y2="438" class="arrow"/>
  <text x="60" y="558" class="sub">Figura 2 - Fluxo de autenticacao JWT e validacao de acesso a tarefa.</text>
</svg>
